[package]
name = "masstree"
version = "0.9.0"
edition = "2024"
rust-version = "1.92.0"
authors = ["consistent-milk12"]
description = "A high-performance concurrent ordered map (trie of B+trees)"
license = "MIT"
repository = "https://github.com/consistent-milk12/masstree"
documentation = "https://docs.rs/masstree"
keywords = [
	"data-structures",
	"concurrent",
	"ordered-map",
	"range-scans",
	"trie",
]
categories = ["data-structures", "concurrency"]
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "LICENSE", "README.md"]

[features]
default = []
# mimalloc is the optimal allocator for this data structure based on current benchmarks.
# Even though the original implementation prefers tcmalloc.
mimalloc = ["dep:mimalloc"]
tcmalloc = ["dep:tcmalloc"]

tracing = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-appender"]
debug-routing = []
no-prefetch = []

# Use 256-byte inline suffix bags (vs 512-byte default).
small-suffix-capacity = []

sidecar-suffix = []

[dependencies]
seize = "0.5.1"
arrayvec = "0.7.6"
static_assertions = "1.1.0"
rustc-hash = "2.1.1"
crossbeam-queue = "0.3.12"

mimalloc = { version = "0.1.48", optional = true }
tcmalloc = { version = "0.3.0", optional = true }

# Optional tracing (enabled via features) - zero overhead when disabled
tracing = { version = "0.1.44", features = ["attributes"], optional = true }
tracing-subscriber = { version = "0.3.22", features = [
	"env-filter",
	"fmt",
	"json",
], optional = true }
tracing-appender = { version = "0.2.4", optional = true }

[dev-dependencies]
parking_lot = "0.12.5"
clap = { version = "4.5.60", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
divan = "0.1.21"
proptest = "1.10.0"
loom = "0.7.2"
shuttle = "0.8.1"
crossbeam-skiplist = "0.1.3"
crossbeam-epoch = "0.9.18"
rand = "0.10.0"
rand_chacha = "0.10.0"
rand_distr = "0.6.0"
indexset = { version = "0.15.0", features = ["concurrent"] }
scc = "3.6.5"
sdd = "4.6.3"
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.22", features = [
	"env-filter",
	"fmt",
	"json",
	"parking_lot",
] }
criterion = { version = "0.8.2", features = [
	"html_reports",
	"csv_output",
	"real_blackbox",
] }
pbench = "0.2.0"

# Examples dependencies
rayon = "1.11.0"
core_affinity = "0.8.3"
tokio = { version = "1.49.0", features = ["full"] }
dhat = "0.3.3"
hdrhistogram = "7.5.4"
minstant = "0.1.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(shuttle)'] }

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
incremental = true

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = "abort"
codegen-units = 1
strip = "symbols"

[profile.release-with-debug]
inherits = "release"
debug = 2
strip = "none"
lto = false

[profile.profiling]
inherits = "release"
debug = 2
strip = "none"
lto = false

[profile.profiling.package."*"]
debug = true

[profile.bench]
inherits = "release"

[[bench]]
name = "concurrent_read_write"
harness = false

[[bench]]
name = "high_impact"
harness = false

[[bench]]
name = "mttest"
harness = false

[[bench]]
name = "range_masstree15"
harness = false

[[bench]]
name = "tail_latency"
harness = false

# =========================================================================
#  Examples
# =========================================================================

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "rayon_parallel"
path = "examples/rayon_parallel.rs"

[[example]]
name = "tokio_async"
path = "examples/tokio_async.rs"

[[example]]
name = "url_cache"
path = "examples/url_cache.rs"

[[example]]
name = "session_store"
path = "examples/session_store.rs"
