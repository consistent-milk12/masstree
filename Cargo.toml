[package]
name = "masstree"
version = "0.8.0"
edition = "2024"
rust-version = "1.92.0"
authors = ["consistent-milk12"]
description = "A high-performance concurrent ordered map (trie of B+trees)"
license = "MIT"
repository = "https://github.com/consistent-milk12/masstree"
documentation = "https://docs.rs/masstree"
keywords = [
	"data-structures",
	"concurrent",
	"ordered-map",
	"range-scans",
	"trie",
]
categories = ["data-structures", "concurrency", "database-implementations"]
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "LICENSE", "README.md"]

[features]
default = []
# Optimal Allocator for this data structure based on current benchmarks.
# Even though the original implementation prefers tcmalloc.
mimalloc = ["dep:mimalloc"]
tcmalloc = ["dep:tcmalloc"]

# When disabled (default), all tracing calls compile to no-ops with zero overhead.
# When enabled, auto-initializes a subscriber that writes NDJSON logs to logs/masstree.jsonl.
# Respects RUST_LOG env var (default: info). Set MASSTREE_LOG_CONSOLE=0 to disable console.
tracing = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-appender"]
debug-routing = []                                                          # Enable routing debug output for bug investigation
no-prefetch = []                                                            # Disable all software prefetching for A/B benchmarking
insert-stats = []                                                           # Enable insert retry statistics collection

# Use 256-byte inline suffix bags (vs 512-byte default).
# Reduces embedded leaf size: 1152 → 896 bytes. Also reduces sidecar heap
# allocation size when `sidecar-suffix` is enabled.
small-suffix-capacity = []

# Use sidecar (pointer-indirect) suffix storage for InlinePolicy instead of embedded.
# Shrinks InlinePolicy leaves: 1152 → 576 bytes (better cache for short-key/read-heavy workloads).
# Tradeoff: adds a pointer chase on every suffix read (worse for string-key workloads).
sidecar-suffix = []

[dependencies]
seize = "0.5.1"
arrayvec = "0.7.6"
static_assertions = "1.1.0"
rustc-hash = "2.1.1"
crossbeam-queue = "0.3.12"

mimalloc = { version = "0.1.48", optional = true }
tcmalloc = { version = "0.3.0", optional = true }

# Optional tracing (enabled via features) - zero overhead when disabled
tracing = { version = "0.1.44", features = ["attributes"], optional = true }
tracing-subscriber = { version = "0.3.22", features = [
	"env-filter",
	"fmt",
	"json",
], optional = true }
tracing-appender = { version = "0.2.4", optional = true }

[dev-dependencies]
parking_lot = "0.12.5"
clap = { version = "4.5.58", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
divan = "0.1.21"
proptest = "1.10.0"
loom = "0.7.2"
shuttle = "0.8.1"
crossbeam-skiplist = "0.1.3"
crossbeam-epoch = "0.9.18"
rand = "0.10.0"
rand_chacha = "0.10.0"
rand_distr = "0.6.0"
indexset = { version = "0.15.0", features = ["concurrent"] }
scc = "3.6.1"
sdd = "4.6.2"
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.22", features = [
	"env-filter",
	"fmt",
	"json",
	"parking_lot",
] }
criterion = { version = "0.8.2", features = [
	"html_reports",
	"csv_output",
	"real_blackbox",
] }

# Examples dependencies
rayon = "1.11.0"
core_affinity = "0.8.3"
tokio = { version = "1.49.0", features = ["full"] }
dhat = "0.3.3"

[lints.rust]
# Allow loom and shuttle cfg for deterministic concurrency testing
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(shuttle)'] }

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
incremental = true

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = "abort"
codegen-units = 1
strip = "symbols"

[profile.release-with-debug]
inherits = "release"
debug = 2
strip = "none"
lto = false

# Profiling profile - optimized for flamegraph/perf
# Frame pointers required for accurate stack traces
[profile.profiling]
inherits = "release"
debug = 2
strip = "none"
lto = false

# Force frame pointers in our code (dependencies need RUSTFLAGS)
[profile.profiling.package."*"]
debug = true

[profile.bench]
inherits = "release"

